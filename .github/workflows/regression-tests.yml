name: CI/CD

on:
  push:
    branches: [main, develop, qgraql-revamp]
  pull_request:
    branches: [main]

env:
  AICONTEXTDB_ADMIN_KEY: ci-test-key
  AICONTEXTDB_ENV: development
  AICONTEXTDB_REGION: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check contextsynapse/ tests/
      - name: Ruff format check
        run: ruff format --check contextsynapse/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy contextsynapse/ --ignore-missing-imports

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --color=yes
      - name: Run integration tests (RBAC, A2A)
        run: pytest tests/integration/ -v --tb=short --color=yes

  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=contextsynapse --cov-report=xml --cov-report=term -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  api-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Verify API boots and Agent Card works
        run: |
          python -c "
          import asyncio, os
          os.environ['AICONTEXTDB_ADMIN_KEY'] = 'ci-test-key'
          os.environ['AICONTEXTDB_ENV'] = 'development'
          from httpx import AsyncClient, ASGITransport
          from contextsynapse.api.api import app
          async def test():
              async with AsyncClient(transport=ASGITransport(app=app), base_url='http://test') as c:
                  r = await c.get('/health')
                  assert r.status_code == 200, f'Health check failed: {r.status_code}'
                  r = await c.get('/.well-known/agent.json')
                  assert r.status_code == 200, 'Agent Card failed'
                  card = r.json()
                  assert card.get('name') == 'AIContextDB', f'Wrong name: {card.get(\"name\")}'
                  print(f'API OK: {card[\"name\"]} with {len(card.get(\"skills\",[]))} skills')
          asyncio.run(test())
          "
      - name: Verify tool registry
        run: |
          python -c "
          import os
          os.environ['AICONTEXTDB_ADMIN_KEY'] = 'ci-test-key'
          os.environ['AICONTEXTDB_ENV'] = 'development'
          from contextsynapse.tools import ToolRegistry
          count = ToolRegistry.count()
          assert count >= 40, f'Expected 40+ tools, got {count}'
          print(f'ToolRegistry OK: {count} tools')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t contextsynapse:test .
      - name: Verify image runs
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e AICONTEXTDB_ADMIN_KEY=ci-test-key \
            -e AICONTEXTDB_ENV=development \
            contextsynapse:test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npx react-scripts build
        env:
          CI: true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npx react-scripts test --watchAll=false --verbose
        env:
          CI: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements/requirements-lightweight.txt
        continue-on-error: true
      - name: Check for secrets in code
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── CD: Deploy on main push (manual trigger or auto) ──────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-smoke-test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t contextsynapse:${{ github.sha }} -t contextsynapse:latest .
      - name: Deploy notification
        run: echo "Ready to deploy contextsynapse:${{ github.sha }} — push to registry or trigger deployment here"
