name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check contextsynapse/ --select E,F,W --ignore E501

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov
      - name: Run tests
        env:
          CONTEXTSYNAPSE_ADMIN_KEY: test-admin-key
          CONTEXTSYNAPSE_JWT_SECRET: test-jwt-secret
          CONTEXTSYNAPSE_REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/ -v --cov=contextsynapse --cov-report=xml -x --timeout=120
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx react-scripts test --watchAll=false --ci --coverage
      - name: Build
        run: npm run build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run benchmarks
        env:
          CONTEXTSYNAPSE_ADMIN_KEY: bench-key
          CONTEXTSYNAPSE_JWT_SECRET: bench-jwt-secret
        run: |
          python benchmarks/bench_storage.py > benchmark-results.txt 2>&1 || true
          python benchmarks/bench_accuracy.py >> benchmark-results.txt 2>&1 || true
          cat benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit
      - name: Security scan
        run: |
          bandit -r contextsynapse/ -s B101,B601 -f json -o bandit-report.json || true
          cat bandit-report.json
      - name: Check for secrets
        run: |
          git log --all --diff-filter=A -- '*.py' '*.yaml' '*.yml' '*.json' '*.toml' | \
            grep -iE '(api_key|secret|password|token)\s*=' || echo "No secrets found in git log"
