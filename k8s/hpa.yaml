## API autoscaler — scale based on CPU usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contextsynapse-api-hpa
  namespace: contextsynapse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contextsynapse-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
## Worker autoscaler — scale based on CPU (queue depth via custom metrics if available)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contextsynapse-worker-hpa
  namespace: contextsynapse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contextsynapse-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
