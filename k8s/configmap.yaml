apiVersion: v1
kind: ConfigMap
metadata:
  name: contextsynapse-config
  namespace: contextsynapse
data:
  AICONTEXTDB_DEPLOY_MODE: "kubernetes"
  AICONTEXTDB_REDIS_URL: "redis://redis:6379/0"
  AICONTEXTDB_GRAPH_BACKEND: "redis"
  AICONTEXTDB_STORAGE_BACKEND: "s3"
  AICONTEXTDB_S3_BUCKET: "CHANGE_ME"
  AICONTEXTDB_S3_REGION: "us-east-1"
  AICONTEXTDB_S3_PREFIX: "graphs/"
  AICONTEXTDB_LLM_MAX_CONCURRENT: "10"
  AICONTEXTDB_LLM_RPM: "100"
  AICONTEXTDB_MAX_GRAPHS: "50"
  AICONTEXTDB_WB_FLUSH_INTERVAL: "10"
  AICONTEXTDB_RATE_LIMIT_RPM: "60"
  AICONTEXTDB_CORS_ORIGINS: "https://app.yourdomain.com"
  AICONTEXTDB_ENV: "production"
  AICONTEXTDB_ENFORCE_TENANT_SCOPE: "1"
