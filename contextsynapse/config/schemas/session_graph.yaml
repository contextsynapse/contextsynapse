NAMESPACE: session_graph
VERSION: "1.0"
DESCRIPTION: >
  Unified session graph schema. The knowledge layer (Document, TextChunk,
  Entity) is built by the ingestion pipeline. The conversation layer (Turn,
  Topic, Decision, Question, Action) is built by the InteractionGraphifier
  as agents interact. Cross-layer edges (REFERENCES, AFFECTS, ABOUT) link
  conversation nodes to knowledge nodes so agents can traverse from
  "what did we discuss about X" to the actual entity node for X.

  This file is editable. Add or remove node/edge types to control what the
  session graph accepts. The SchemaValidator enforces these constraints.

# ──────────────────────────────────────────────────────────────────────────
# Knowledge Layer — created by ingestion pipelines
# ──────────────────────────────────────────────────────────────────────────

NODES:
  Document:
    description: An ingested document (PDF, text, URL, etc.)
    fields:
      title: string
      source: string
      text: string
      created_at: datetime

  TextChunk:
    description: A chunk of text split from a document
    fields:
      content: string!
      chunk_index: int
      parent_id: string

  Entity:
    description: A named entity extracted from text
    fields:
      entity_name: string!
      entity_type: string!
      description: string

  Relationship:
    description: An extracted relationship between entities
    fields:
      relation_type: string!
      description: string

  # ────────────────────────────────────────────────────────────────────────
  # Conversation Layer — created by InteractionGraphifier
  # ────────────────────────────────────────────────────────────────────────

  AgentPresence:
    description: An agent's presence in this session
    fields:
      agent_id: string!
      agent_name: string
      joined_at: datetime!
      platform: string

  Turn:
    description: A single message turn (user, assistant, system, or tool)
    fields:
      role: string!
      content: string!
      agent_id: string!
      timestamp: datetime!
      turn_index: int!
      conversation_id: string
      significance: float

  Topic:
    description: A topic or subject extracted from conversation
    fields:
      name: string!
      first_mentioned_at: datetime
      mention_count: int

  Decision:
    description: A decision made during conversation
    fields:
      summary: string!
      decided_at: datetime!
      agent_id: string
      confidence: float

  Question:
    description: A question raised during conversation
    fields:
      text: string!
      asked_at: datetime!
      agent_id: string
      status: string

  Action:
    description: An action item or commitment from conversation
    fields:
      description: string!
      assigned_to: string
      created_at: datetime!
      status: string

# ──────────────────────────────────────────────────────────────────────────
# Edges
# ──────────────────────────────────────────────────────────────────────────

EDGES:
  # Conversation layer
  NEXT_TURN:
    from: Turn
    to: Turn
    relation: next_turn_in_agent_chain

  SPOKEN_BY:
    from: Turn
    to: AgentPresence
    relation: spoken_by_agent

  RAISES:
    from: Turn
    to: [Topic, Question]
    relation: raises_subject

  DECIDES:
    from: Turn
    to: Decision
    relation: decides_on

  ASSIGNS:
    from: Turn
    to: Action
    relation: assigns_action

  CONCURRENT_WITH:
    from: Turn
    to: Turn
    relation: concurrent_cross_agent

  ANSWERS:
    from: Turn
    to: Question
    relation: answers_question

  # Cross-layer
  REFERENCES:
    from: [Turn, Decision, Action]
    to: [Entity, Document, TextChunk]
    relation: references_knowledge

  AFFECTS:
    from: Decision
    to: [Entity, Document]
    relation: affects_entity

  ABOUT:
    from: [Question, Topic]
    to: [Entity, Document]
    relation: about_entity

  # Knowledge layer (from ingestion)
  CONTAINS_CHUNK:
    from: Document
    to: TextChunk
    relation: contains_chunk

  MENTIONS:
    from: [TextChunk, Document]
    to: Entity
    relation: mentions_entity

  RELATED_TO:
    from: Entity
    to: Entity
    relation: related_to
