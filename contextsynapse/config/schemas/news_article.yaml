# News Article Extraction Schema
# Used when ingesting news articles, press releases, and journalism content.

name: news_article

node_types:
  Person:
    fields: [name, role, affiliation, nationality]
    required: [name]
    description: "A person mentioned or quoted in the article"

  Organization:
    fields: [name, type, country, industry]
    required: [name]
    description: "A company, government body, or institution mentioned in the article"

  Event:
    fields: [name, date, location, description, type]
    required: [name]
    description: "A news event, incident, or occurrence described in the article"

  Location:
    fields: [name, type, country, region, coordinates]
    required: [name]
    description: "A geographic place referenced in the article"

  Fact:
    fields: [statement, date, source, confidence]
    required: [statement]
    description: "A verifiable factual claim made in the article"

  Quote:
    fields: [text, speaker, context, date]
    required: [text]
    description: "A direct quotation attributed to a person"

edge_types:
  MENTIONED_IN:
    source: Person
    target: Event
  WORKS_FOR:
    source: Person
    target: Organization
  LOCATED_IN:
    source: Event
    target: Location
  SAID:
    source: Person
    target: Quote
  ABOUT:
    source: Quote
    target: Event

fact_types:
  - type: Claim
    fields: [statement, confidence, source_text, date]
    description: "A factual or editorial claim made in the article"

  - type: Statistic
    fields: [name, value, unit, date, source_text]
    description: "A numerical figure or statistic cited in the article"
