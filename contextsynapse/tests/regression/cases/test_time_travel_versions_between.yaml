id: test_timetravel_005
name: Time Travel - Query VERSIONS BETWEEN
description: 'Tests SELECT query with VERSIONS BETWEEN clause to get versions in time
  range.

  Requires temporal queries to be enabled.

  '
query: 'CREATE NODE Person { name: "David", age: 30 };

  UPDATE NODE Person SET { age: 31 } WHERE name = "David";

  UPDATE NODE Person SET { age: 32 } WHERE name = "David";


  SELECT * FROM Person VERSIONS BETWEEN TIMESTAMP ''2024-01-01T00:00:00Z'' AND ''2024-12-31T23:59:59Z''
  WHERE name = "David"'
namespace: timetravel_test
expected_success: true
