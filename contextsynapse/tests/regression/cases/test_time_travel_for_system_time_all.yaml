  UPDATE NODE Person SET { age: 21 } WHERE name = "Charlie";

  UPDATE NODE Person SET { age: 22, city: "NYC" } WHERE name = "Charlie";


  SELECT * FROM Person FOR SYSTEM_TIME ALL WHERE name = "Charlie"'
