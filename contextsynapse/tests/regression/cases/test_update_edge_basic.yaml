id: test_update_001
name: UPDATE EDGE - Basic
description: Tests basic UPDATE EDGE query to modify edge properties
query: |
  CREATE NODE Person AS p1 { name: "Alice" };
  CREATE NODE Person AS p2 { name: "Bob" };
  CREATE EDGE KNOWS SRC p1 DEST p2 { weight: 1.0, since: 2020 };
  UPDATE EDGE KNOWS SET { weight: 2.0, updated: true } WHERE source.name = "Alice" AND target.name = "Bob"
