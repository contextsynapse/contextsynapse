id: test_pipeline_009
name: Pipeline - Large Embedding Model
description: 'Tests ingestion pipeline with text-embedding-3-large embedding model.

  Higher quality embeddings (3072 dimensions).

  Uses GPT-3.5-Turbo for chunking.

  Uses text-embedding-3-large for embeddings.

  Processes 25-30 pages.

  '
query: "CREATE PIPELINE regression_large_embedding_pipeline\nIN NAMESPACE tcs_regression_pipeline\n\
  SOURCE COLLECTION raw_docs\nTARGET COLLECTION knowledge_graph\nDESCRIPTION \"Regression\
  \ test: Large embedding model (text-embedding-3-large, 25-30 pages)\"\nCHECKPOINT\
  \ POLICY enabled\nSTAGES = [\n  STEP extract\n      EXTRACT FROM FILE \"input-doc/annual-report-2024-2025.pdf\"\
  \n      USING READER \"AUTO\"\n      PARAMETERS (max_pages: 30),\n  \n  STEP chunk\n\
  \      CHUNK BY semantic\n      USING MODEL \"gpt-3.5-turbo\"\n      PROMPT \"Split\
  \ the following text into semantic chunks preserving meaning. Each chunk should\
  \ be coherent and self-contained.\"\n      PARAMETERS (max_tokens: 1000, overlap:\
  \ 100)\n      STORE AS NODE TYPE Chunk\n      LINK TO Document ON HAS_CHUNK,\n \
  \ \n  STEP embed\n      EMBED USING MODEL \"text-embedding-3-large\"\n      PARAMETERS\
  \ (dimensions: 3072, normalize: true)\n      STORE EMBEDDING IN Chunk.embedding,\n\
  \  \n  STEP index\n      INDEX USING {bm25: true, vector: true, graph: true}\n]"
namespace: tcs_regression_pipeline
expected_success: true
expected_nodes: 50
expected_edges: 10
tags:
- pipeline
- ingestion
- semantic_chunking
- gpt-3.5
- large_embedding
verify_persistence: true
test_both_modes: true
approved_by: system
notes: 'Tests CREATE PIPELINE with text-embedding-3-large.

  Higher quality embeddings (3072 dimensions vs 1536).

  Includes prompt for chunking model.

  Includes explicit large embedding model.

  '
priority: 4
prerequisites: []
requires_data: false
requires_files:
- input-doc/annual-report-2024-2025.pdf
