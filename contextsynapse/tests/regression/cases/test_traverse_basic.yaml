id: test_traverse_001
name: TRAVERSE - Basic
description: Tests basic TRAVERSE query to navigate graph relationships
query: |
  CREATE NODE Person AS p1 { name: "Alice" };
  CREATE NODE Person AS p2 { name: "Bob" };
  CREATE NODE Person AS p3 { name: "Charlie" };
  CREATE EDGE KNOWS SRC p1 DEST p2 { since: 2020 };
  CREATE EDGE KNOWS SRC p2 DEST p3 { since: 2021 };
  TRAVERSE FROM p1 VIA KNOWS LIMIT 10
