# Example Extraction Schema
# Define what entity types, relationships, and facts the LLM should extract.
# Use with: EntityExtractor(db, schema="config/examples/extraction_schema.yaml")

name: project_knowledge

node_types:
  Person:
    fields: [name, role, department, email, expertise]
    required: [name]
    description: A person (employee, stakeholder, customer)

  Organization:
    fields: [name, type, industry, location, size]
    required: [name]
    description: A company, team, department, or external org

  System:
    fields: [name, status, owner, tech_stack, description]
    required: [name]
    description: A software system, service, or component

  Technology:
    fields: [name, category, version, license]
    required: [name]
    description: A programming language, framework, tool, or platform

  Concept:
    fields: [name, definition, domain]
    required: [name]
    description: An abstract concept, methodology, or standard

edge_types:
  WORKS_AT:
    source: Person
    target: Organization
  MAINTAINS:
    source: Person
    target: System
  USES:
    source: System
    target: Technology
  DEPENDS_ON:
    source: System
    target: System
  PART_OF:
    source: Person
    target: Organization
  OWNS:
    source: Person
    target: System
  IMPLEMENTS:
    source: System
    target: Concept

fact_types:
  - type: Claim
    fields: [statement, confidence, source_text]
    description: A verifiable statement or assertion

  - type: Metric
    fields: [name, value, unit, period, comparison, source_text]
    description: A quantitative measurement or KPI

  - type: Decision
    fields: [title, rationale, decided_by, status, source_text]
    description: A technical or business decision

  - type: Date
    fields: [event, date, description, source_text]
    description: A significant date or deadline

  - type: Requirement
    fields: [title, priority, status, source_text]
    description: A business or technical requirement
